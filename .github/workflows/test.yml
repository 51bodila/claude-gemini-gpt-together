name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
        exclude:
          # GitHub's free macOS runners are scarce: one macOS job is enough (real Mac tested by hand)
          - os: macos-latest
            node: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and end-to-end tests (fake CLIs, no network, no secrets)
        run: node tests/run-all.js
      - name: Install / uninstall round-trip in a fake home
        run: node --test tests/install.test.js
